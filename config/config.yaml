# Configuration du projet Influencer or Observer

# Chemins des fichiers
paths:
  data_dir: "data"
  train_file: "data/train.jsonl"
  test_file: "data/kaggle_test.jsonl"
  models_dir: "models"
  submissions_dir: "submissions"
  reports_dir: "reports"

# Paramètres de preprocessing
preprocessing:
  remove_urls: true
  remove_mentions: true
  remove_hashtags: false  # Garder les hashtags peut être informatif
  lowercase: true
  remove_punctuation: false
  min_text_length: 5
  
# Paramètres TF-IDF
tfidf:
  max_features: 1000
  max_df: 0.7  # Ignore les mots qui apparaissent dans >70% des documents
  min_df: 3    # Ignore les mots qui apparaissent dans <3 documents
  ngram_range: [1, 2]  # Unigrams et bigrams
  use_stopwords: true
  stopwords_language: "french"

# Paramètres Logistic Regression
logistic_regression:
  solver: "liblinear"
  max_iter: 1000
  C: 1.0
  random_state: 42
  class_weight: null  # Ou "balanced" si déséquilibre de classes

# Paramètres Random Forest
random_forest:
  n_estimators: 100
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42
  n_jobs: -1

# Paramètres XGBoost
xgboost:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

# Paramètres LightGBM
lightgbm:
  n_estimators: 100
  max_depth: -1
  learning_rate: 0.1
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

# Paramètres de validation
validation:
  cv_folds: 5
  stratified: true
  shuffle: true
  random_state: 42
  test_size: 0.2  # Pour train_test_split

# Paramètres d'évaluation
evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
  print_classification_report: true
  save_confusion_matrix: true

# Paramètres d'entraînement
training:
  verbose: 1
  save_model: true
  model_format: "joblib"  # Ou "pickle"

# Features à utiliser
features:
  text_features:
    - "full_text"
  user_features:
    - "user.statuses_count"
    - "user.location"
    - "source"
  custom_features:
    - "text_length"
    - "hashtag_count"
    - "mention_count"
    - "url_count"
    - "emoji_count"

# Random seed pour reproductibilité
random_state: 42

# Paramètres de logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "reports/training.log"
